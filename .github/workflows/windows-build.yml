# Windows 用 exe をビルドして検証する。タグ v* を push したときは GitHub Release も作る。
#
# リリース手順: app/server.py の __version__ を上げてコミット → git tag vX.Y.Z → git push origin main --tags
# 公開された Release の windows.json（releases/latest/download/windows.json）をアプリの更新確認が読む。
name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pyinstaller pytest
      - run: python -m pytest -q
      - run: python scripts/build_windows.py
      - name: Verify bundled application
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'clipbridge-self-test.json'
          $process = Start-Process -FilePath build/windows/ClipBridge.exe -ArgumentList @('--self-test', $result) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Bundled self-test timed out' }
          if ($process.ExitCode -ne 0) { throw "Bundled self-test failed (exit $($process.ExitCode))" }
          $data = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $data.ok -or -not $data.frozen) { throw 'Bundle validation failed' }
          Write-Host "self-test ok: ClipBridge $($data.version) (clipboard: $($data.clipboard))"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-Windows
          path: build/windows/
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content build/windows/windows.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }
          gh release create "${{ github.ref_name }}" `
            build/windows/ClipBridge.exe build/windows/ClipBridge-Windows.zip `
            build/windows/SHA256SUMS.txt build/windows/windows.json `
            --title "ClipBridge $version" --generate-notes
