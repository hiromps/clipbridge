name: Build free Windows application
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/build_windows.py'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/requirements.txt pyinstaller pytest
      - run: python -m pytest tests -q
      - run: python scripts/build_windows.py
      - name: Verify bundled application
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'clipbridge-self-test.json'
          $process = Start-Process -FilePath build/windows/ClipBridge.exe -ArgumentList @('--self-test', $result) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Bundled self-test failed' }
          $data = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $data.ok -or -not $data.frozen) { throw 'Bundle validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-Windows
          path: |
            build/windows/ClipBridge.exe
            build/windows/SHA256SUMS.txt
            dist/downloads/ClipBridge-Windows.zip
            dist/updates/windows.json
